:root{
  --p-bg:#0b0b0c;--p-surface:#151517;--p-surface-2:#1d1d20;--p-ink:#f4f4f2;--p-muted:#9a9a9f;
  --p-accent:#d80015;--p-accent-hi:#ef1a2e;--p-accent-ink:#fff;
  --p-inv-bg:#f4f4f2;--p-inv-surface:#e1e1df;--p-inv-ink:#0b0b0c;--p-inv-muted:#585858;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,.8,.2,1);--ease-io:cubic-bezier(.65,0,.35,1);
  --bar:68px;--panel:440px;--r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--p-bg);color:var(--p-ink);font:16px/1.5 var(--font);font-stretch:100%;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--p-accent);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* bar */
.bar{height:var(--bar);display:flex;align-items:center;gap:28px;padding:0 24px 0 20px;border-bottom:1px solid #1f1f22;position:relative;z-index:5;background:var(--p-bg)}
.logo{display:flex;align-items:center;background:#fff;border-radius:10px;padding:6px 12px;transition:transform .3s var(--ease)}
.logo:hover{transform:translateY(-1px)}
.logo img{height:30px;width:auto}
.steps{display:flex;gap:4px;margin:0 auto}
.steps button{position:relative;padding:10px 16px;font-size:15px;color:var(--p-muted);border-radius:999px;transition:color .25s,background .25s}
.steps button:not(:disabled):hover{color:var(--p-ink);background:var(--p-surface)}
.steps button[aria-current="step"]{color:var(--p-ink)}
.steps button[aria-current="step"]::after{content:"";position:absolute;left:16px;right:16px;bottom:3px;height:2px;border-radius:2px;background:var(--p-accent);animation:draw .45s var(--ease) both}
.steps button:disabled{opacity:.35;cursor:default}
.bar .call{font-size:15px;font-weight:600;padding:10px 18px;border-radius:999px;border:1px solid #333338;transition:background .25s,border-color .25s,transform .2s}
.bar .call:hover{background:var(--p-surface);border-color:#4a4a50}
.bar .call:active{transform:scale(.97)}

/* app */
.app{display:grid;grid-template-columns:minmax(0,1fr) var(--panel);height:calc(100vh - var(--bar));min-height:620px}
.stage{position:relative;overflow:hidden;color:var(--p-inv-ink);background:radial-gradient(110% 85% at 50% 38%,#fdfdfc 0%,#f1f0ed 52%,#e2e0dc 100%)}
.stage-head{transition:opacity .5s var(--ease),transform .6s var(--ease);position:absolute;left:clamp(20px,3vw,44px);top:clamp(20px,3.2vw,40px);z-index:3;max-width:70%}
.make{display:flex;align-items:center;gap:10px;color:var(--p-inv-muted);font-size:16px;font-weight:500}
.make img{height:22px;width:auto;filter:brightness(0);opacity:.8}
.stage h1{margin:6px 0 0;font-size:clamp(44px,6.2vw,104px);line-height:.92;letter-spacing:-.035em;font-weight:500;font-stretch:112%}
.spec{margin:14px 0 0;font-size:17px;color:#3c3c3f}
.spec b{font-weight:600;color:var(--p-inv-ink)}
.stage.zoomed .stage-head{opacity:0;transform:translateY(-12px);pointer-events:none}
.frame{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform 1.05s var(--ease-io);mix-blend-mode:multiply}
.layer{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .5s var(--ease),transform .8s var(--ease)}
.layer.on{opacity:1;transform:none}
.layer.from-right{transform:translateX(48px)}
.layer.to-left{transform:translateX(-48px);opacity:0}
.stage-foot{position:absolute;left:clamp(20px,3vw,44px);right:clamp(20px,3vw,44px);bottom:clamp(18px,2.6vw,32px);z-index:3;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.quick{display:flex;flex-wrap:wrap;gap:8px;max-width:60%}
.qd{width:28px;height:28px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);transition:transform .25s var(--ease),box-shadow .25s}
.qd:hover{transform:scale(1.12)}
.qd[aria-pressed="true"]{box-shadow:0 0 0 2px var(--p-inv-bg),0 0 0 4px var(--p-inv-ink)}
.view{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button{padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;color:#55555a;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--p-inv-ink);color:#fff}
.arrow{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:transform .2s var(--ease),background .2s}
.arrow:hover{transform:translateY(-2px)}.arrow:active{transform:scale(.94)}
.arrow svg{width:18px;height:18px}
.hint{position:absolute;left:50%;bottom:clamp(76px,9vw,100px);transform:translateX(-50%);z-index:3;font-size:14px;color:#55555a;background:rgba(255,255,255,.75);padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .4s}
.hint.show{opacity:1}

/* panel */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--p-bg);border-left:1px solid #1f1f22}
.p-head{padding:28px 28px 6px}
.p-head h2{margin:0;font-size:30px;line-height:1.05;letter-spacing:-.025em;font-weight:500;font-stretch:110%}
.p-head p{margin:8px 0 0;color:var(--p-muted);font-size:15px}
.p-body{flex:1;min-height:0;overflow-y:auto;padding:18px 28px 28px;scrollbar-width:thin;scrollbar-color:#2a2a2e transparent}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid.w{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{position:relative;display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:var(--r);background:var(--p-surface);text-align:left;transition:background .25s,transform .3s var(--ease);animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.opt:hover{background:var(--p-surface-2);transform:translateY(-2px)}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{background:var(--p-surface-2);box-shadow:inset 0 0 0 2px var(--p-accent)}
.opt .lg{height:86px;border-radius:10px;background:#0f0f11;display:grid;place-items:center}
.opt .lg img{max-height:40px;max-width:70%;filter:brightness(0) invert(1);opacity:.92;transition:transform .35s var(--ease)}
.opt:hover .lg img{transform:scale(1.07)}
.opt .ph{border-radius:10px;background:var(--p-inv-bg);aspect-ratio:3/2;overflow:hidden}
.opt .ph img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;transition:transform .6s var(--ease)}
.opt:hover .ph img{transform:scale(1.05)}
.opt .wl{aspect-ratio:1;border-radius:10px;background:radial-gradient(circle at 50% 45%,#2a2a2e,#0f0f11 72%);display:grid;place-items:center;overflow:hidden}
.opt .wl img{width:90%;height:90%;object-fit:contain;transition:transform .7s var(--ease)}
.opt:hover .wl img{transform:rotate(24deg) scale(1.04)}
.opt .wl.factory{background:#0f0f11;color:var(--p-muted);font-size:13px;text-align:center;padding:12px}
.opt b{font-weight:600;font-size:15px;line-height:1.25;padding:0 2px}
.opt small{display:block;color:var(--p-muted);font-size:13px;font-weight:400}
.sw-grid{display:flex;flex-wrap:wrap;gap:14px}
.sw{width:56px;height:56px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);transition:transform .25s var(--ease),box-shadow .25s;animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*30ms)}
.sw:hover{transform:scale(1.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--p-bg),0 0 0 5px var(--p-ink)}
.cname{margin:22px 0 0;font-size:22px;font-weight:500;letter-spacing:-.01em}
.cname small{display:block;color:var(--p-muted);font-size:14px;margin-top:2px}
.chips{display:flex;gap:6px;margin:0 0 14px}
.chip{padding:8px 14px;border-radius:999px;background:var(--p-surface);font-size:14px;color:var(--p-muted);transition:background .25s,color .25s}
.chip:hover{color:var(--p-ink)}
.chip[aria-pressed="true"]{background:var(--p-ink);color:var(--p-bg)}
.next{margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--p-accent);color:#fff;font-weight:600;font-size:16px;padding:15px 24px;border-radius:999px;transition:background .25s,transform .2s var(--ease)}
.btn:hover{background:var(--p-accent-hi);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--p-surface);color:var(--p-ink)}
.btn.ghost:hover{background:var(--p-surface-2)}
.p-foot{border-top:1px solid #1f1f22;padding:18px 28px 22px;display:grid;gap:14px}
.sum{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--p-muted)}
.sum b{display:block;color:var(--p-ink);font-size:16px;font-weight:600}
.sum .wsum{text-align:right}
.ctas{display:grid;grid-template-columns:1fr auto;gap:10px}
.credit{margin:0;color:#5c5c62;font-size:12px}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.enter{animation:rise .8s var(--ease) both}
@media(max-width:960px){
  :root{--bar:60px}
  .bar{gap:12px;padding:0 14px}.steps{display:none}.bar .call{margin-left:auto}
  .app{grid-template-columns:1fr;height:auto}
  .stage{height:min(122vw,640px);min-height:440px}
  .stage h1{font-size:clamp(36px,9vw,60px)}
  .spec{font-size:15px}
  .quick{display:none}
  .panel{border-left:0}
  .p-body{overflow:visible}
  .grid.w{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

38.0,50.0,-6.0],[747,388,24,48,0]]},{"n":"Pewter Olive","h":"#33382d","u":"https://stimg.cardekho.com/images/car-images/930x620/Kia/Sonet/9783/1705386619542/222_Pewter-Olive_33382d.jpg","w":[[461.0,412.0,38.0,51.0,-5.0],[747,388,24,48,0]]},{"n":"Aurora Black Pearl","h":"#161616","u":"https://stimg.cardekho.com/images/car-images/930x620/Kia/Sonet/11395/Kia-Sonet-X-line-Diesel-AT/1719909877316/226_Aurora-Black-Pearl_161616.jpg","w":[[461.0,412.0,38.0,51.0,-5.0],[747,388,24,48,0]]},{"n":"Matte Graphite","h":"#575b5c","u":"https://stimg.cardekho.com/images/car-images/930x620/Kia/Sonet/11397/1781264555750/Matte-Graphite_575b5c.jpg","w":[[461.5,411.0,38.0,50.0,-6.0],[747,388,24,48,0]]},{"n":"Imperial Blue","h":"#192648","u":"https://stimg.cardekho.com/images/car-images/930x620/Kia/Sonet/9783/1705386619542/229_Imperial-Blue_192648.jpg","w":[[461.0,412.0,38.0,51.0,-5.0],[747,388,24,48,0]]},{"n":"Intense Red","h":"#891718","u":"https://stimg.cardekho.com/images/car-images/930x620/Kia/Sonet/9783/1705386619542/225_Intense-Red_891718.jpg","w":[[461.0,412.0,38.0,51.0,-5.0],[747,388,24,48,0]]},{"n":"Glacier White Pearl Aurora Black Pearl","h":"#b4b4b4","u":"https://stimg.cardekho.com/images/car-images/930x620/Kia/Sonet/11396/1708068195256/228_Glacier-White-Pearl-Aurora-Black-Pearl_b4b4b4.jpg","w":[[461.0,412.0,38.0,51.0,-5.0],[747,388,24,48,0]]},{"n":"Gravity Grey","h":"#242729","u":"https://stimg.cardekho.com/images/car-images/930x620/Kia/Sonet/9783/1738729674336/Gravity-Grey_242729.jpg","w":[[463.0,412.0,32.0,51.0,-4.0],[747,388,24,48,0]]}]}];
const BRANDS=[{id:"maruti",n:"Maruti Suzuki",l:"l-maruti.svg"},{id:"hyundai",n:"Hyundai",l:"l-hyundai.webp"},{id:"tata",n:"Tata",l:"l-tata.webp"},{id:"mahindra",n:"Mahindra",l:"l-mahindra.svg"},{id:"kia",n:"Kia",l:"l-kia.webp"}];
const WHEELS=Array.from({length:25},(_,i)=>{const k=String(i+1).padStart(2,"0");return{id:"w"+k,make:i<11?"OZ Racing":"MSW",n:(i<11?"OZ Racing":"MSW")+" style "+k,thumb:"a"+k+".webp",face:"f"+k+".webp"}});
const PH=930,PV=620,K=1395/930;

const S={brand:"hyundai",model:"creta",colour:0,wheel:null,step:"brand",zoom:"full",filter:"all"};
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const model=()=>DATA.find(m=>m.id===S.model);
const brand=id=>BRANDS.find(b=>b.id===id);
const wheel=()=>WHEELS.find(w=>w.id===S.wheel);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* image cache */
const cache={};
function img(src){return cache[src]||(cache[src]=new Promise((ok,no)=>{const i=new Image();i.decoding="async";i.onload=()=>ok(i);i.onerror=()=>no(src);i.src=src}))}

/* drawing */
const layers=[$("c0"),$("c1")];let front=0;
function drawWheel(ctx,e,face,mirror,rot){
  const [cx,cy,rx,ry,a]=e.map((v,i)=>i<4?v*K:v);
  ctx.save();ctx.translate(cx,cy);ctx.rotate(a*Math.PI/180);ctx.scale(rx,ry);
  // tyre bead: covers any trace of the factory rim at the edge
  let g=ctx.createRadialGradient(0,0,.95,0,0,1.11);
  g.addColorStop(0,"rgba(19,19,20,1)");g.addColorStop(.55,"rgba(19,19,20,.92)");g.addColorStop(1,"rgba(19,19,20,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,1.11,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(0,0,1,0,Math.PI*2);ctx.clip();
  // inside of the wheel: brake and hub in shadow
  g=ctx.createRadialGradient(-.08,.05,0,0,0,1);g.addColorStop(0,"#2b2b2e");g.addColorStop(.6,"#141415");g.addColorStop(1,"#0a0a0b");
  ctx.fillStyle=g;ctx.fillRect(-1,-1,2,2);
  ctx.save();if(mirror)ctx.scale(-1,1);ctx.rotate(rot);const s=256/250;ctx.drawImage(face,-s,-s,2*s,2*s);ctx.restore();
  // studio light: arch shadow on top, falloff to the lip
  g=ctx.createLinearGradient(0,-1,0,1);g.addColorStop(0,"rgba(0,0,0,.32)");g.addColorStop(.38,"rgba(0,0,0,.06)");g.addColorStop(.75,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.14)");
  ctx.fillStyle=g;ctx.fillRect(-1,-1,2,2);
  g=ctx.createRadialGradient(0,0,.82,0,0,1);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.38)");
  ctx.fillStyle=g;ctx.fillRect(-1,-1,2,2);
  ctx.restore();
}
async function paint(cv,st,rot=0){
  const m=DATA.find(x=>x.id===st.model),c=m.colours[st.colour];
  const car=await img(c.u);const w=st.wheel?WHEELS.find(x=>x.id===st.wheel):null;const face=w?await img(w.face):null;
  const ctx=cv.getContext("2d");ctx.clearRect(0,0,cv.width,cv.height);
  ctx.filter=m.lift!==1?`brightness(${m.lift})`:"none";ctx.drawImage(car,0,0,cv.width,cv.height);ctx.filter="none";
  // fade the photo's edges to white so it melts into the studio (multiply blend)
  const W=cv.width,H=cv.height,fade=(x0,y0,x1,y1,rx,ry,rw,rh)=>{const g=ctx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,"#fff");g.addColorStop(1,"rgba(255,255,255,0)");ctx.fillStyle=g;ctx.fillRect(rx,ry,rw,rh)};
  fade(0,0,W*.07,0,0,0,W*.07,H);fade(W,0,W*.93,0,W*.93,0,W*.07,H);fade(0,0,0,H*.06,0,0,W,H*.06);fade(0,H,0,H*.86,0,H*.86,W,H*.14);
  if(face){ctx.imageSmoothingQuality="high";for(const e of c.w)drawWheel(ctx,e,face,m.face==="right",rot)}
}
let spinId=0;
async function show(kind){
  const st={...S};const next=layers[1-front],cur=layers[front];
  try{await paint(next,st)}catch(e){return}
  if(st.model!==S.model||st.colour!==S.colour||st.wheel!==S.wheel)return; // stale
  if(kind==="wheel"&&!reduce){
    // spin the new wheel into place on the visible layer
    const id=++spinId,t0=performance.now(),D=950;
    const tick=async now=>{if(id!==spinId)return;const p=Math.min(1,(now-t0)/D),ez=1-Math.pow(1-p,3);await paint(cur,st,(1-ez)*-2.6);if(p<1)requestAnimationFrame(tick)};
    requestAnimationFrame(tick);return;
  }
  next.classList.remove("on","to-left");next.classList.toggle("from-right",kind==="model"&&!reduce);
  void next.offsetWidth;
  next.classList.remove("from-right");next.classList.add("on");
  cur.classList.remove("on");if(kind==="model"&&!reduce)cur.classList.add("to-left");
  front=1-front;
}

/* layout of the car on the stage */
function fit(){
  const st=$("stage"),fr=$("frame"),W=st.clientWidth,H=st.clientHeight,small=W<700;
  const head=small?150:170,foot=small?78:90;
  const w=Math.min(W*1.0,(H-head-foot)*PH/PV*1.08),h=w*PV/PH;
  fr.style.width=w+"px";fr.style.height=h+"px";
  let x=(W-w)/2,y=head+(H-head-foot-h)/2+(small?6:18),s=1;
  if(S.zoom==="wheel"){
    const m=model(),e=m.colours[S.colour].w[0];const cx=e[0]/PH*w,cy=e[1]/PV*h;
    s=Math.min(2.6,Math.max(1.8,(H*.62)/(e[3]*2/PV*h)));
    x=W*.56-cx*s;y=H*.55-cy*s;
  }
  fr.style.transform=`translate(${x}px,${y}px) scale(${s})`;st.classList.toggle("zoomed",S.zoom==="wheel");
}

/* panel */
function steps(){
  document.querySelectorAll(".steps button").forEach(b=>{b.toggleAttribute("aria-current",false);if(b.dataset.go===S.step)b.setAttribute("aria-current","step")});
}
function panel(){
  const m=model(),b=brand(m.brand);let t="",sub="",h="";
  if(S.step==="brand"){t="Choose your brand";sub="Every car is shown in its real paint colours.";
    h=`<div class="grid">${BRANDS.map((x,i)=>{const n=DATA.filter(d=>d.brand===x.id).length;return`<button class="opt" style="--i:${i}" data-brand="${x.id}" aria-pressed="${x.id===S.brand}"><span class="lg"><img src="${x.l}" alt=""></span><b>${x.n}<small>${n} models</small></b></button>`}).join("")}</div>`}
  if(S.step==="model"){t=brand(S.brand).n;sub="Choose your model.";
    h=`<div class="grid">${DATA.filter(d=>d.brand===S.brand).map((d,i)=>`<button class="opt" style="--i:${i}" data-model="${d.id}" aria-pressed="${d.id===S.model}"><span class="ph"><img src="${d.colours[0].u}" alt="" loading="lazy"></span><b>${d.name}<small>${d.type} · ${d.colours.length} colours</small></b></button>`).join("")}</div>`}
  if(S.step==="colour"){const c=m.colours[S.colour];t=m.name+" colours";sub=m.colours.length+" factory colours, shown on the real car.";
    h=`<div class="sw-grid">${m.colours.map((c,i)=>`<button class="sw" style="--c:${c.h};--i:${i}" data-colour="${i}" aria-pressed="${i===S.colour}" aria-label="${esc(c.n)}" title="${esc(c.n)}"></button>`).join("")}</div><p class="cname">${esc(c.n)}<small>${b.n} ${m.name}</small></p><div class="next"><button class="btn" data-go="wheels">Choose your wheels</button></div>`}
  if(S.step==="wheels"){t="Alloy wheels";sub="Tap a wheel to fit it. Use Wheel view for a close look.";
    const list=WHEELS.filter(w=>S.filter==="all"||w.make===S.filter);
    h=`<div class="chips">${[["all","All 25"],["OZ Racing","OZ Racing"],["MSW","MSW"]].map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("")}</div>
    <div class="grid w"><button class="opt" style="--i:0" data-wheel="" aria-pressed="${!S.wheel}"><span class="wl factory">Factory wheels</span><b>Original<small>${m.name}</small></b></button>${list.map((w,i)=>`<button class="opt" style="--i:${(i+1)%12}" data-wheel="${w.id}" aria-pressed="${w.id===S.wheel}"><span class="wl"><img src="${w.thumb}" alt="" loading="lazy"></span><b>${w.make==="MSW"?"MSW":"OZ"} ${w.id.slice(1)}<small>${w.make}</small></b></button>`).join("")}</div>`}
  $("ptitle").textContent=t;$("psub").textContent=sub;$("pbody").innerHTML=h;
}
function head(){
  const m=model(),b=brand(m.brand),c=m.colours[S.colour],w=wheel();
  $("make").innerHTML=b.id==="maruti"?`<img src="${b.l}" alt="">${b.n}`:`<img src="${b.l}" alt="${b.n}" style="height:${b.id==="mahindra"?20:26}px">`;$("title").textContent=m.name;
  $("spec").innerHTML=`<b>${esc(c.n)}</b> · ${w?esc(w.n):"Factory wheels"}`;
  $("quick").innerHTML=m.colours.map((c,i)=>`<button class="qd" style="--c:${c.h}" data-colour="${i}" aria-pressed="${i===S.colour}" aria-label="${esc(c.n)}" title="${esc(c.n)}"></button>`).join("");
  $("view").style.visibility=w?"visible":"hidden";
  $("hint").classList.toggle("show",S.step==="wheels"&&!w);
  document.querySelectorAll("[data-zoom]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.zoom===S.zoom));
  $("sCar").textContent=b.n+" "+m.name;$("sCol").textContent=c.n;$("sWheel").textContent=w?w.n:"Factory";
  const msg=`Hi Car Decor, I'd like to fit ${w?w.n:"new alloy wheels"} on my ${b.n} ${m.name} (${c.n}). When can I come in?`;
  $("book").href="https://wa.me/919845859785?text="+encodeURIComponent(msg);
}
function preload(){model().colours.forEach(c=>img(c.u).catch(()=>{}))}
function update(kind){steps();panel();head();fit();if(kind)show(kind)}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.go){S.step=d.go;return update()}
  if(d.brand){const was=S.brand;S.brand=d.brand;S.step="model";if(was!==d.brand){const m=DATA.find(x=>x.brand===d.brand);S.model=m.id;S.colour=0;S.zoom="full";preload();return update("model")}return update()}
  if(d.model){const ch=d.model!==S.model;S.model=d.model;S.colour=0;S.step="colour";S.zoom="full";preload();return update(ch?"model":null)}
  if(d.colour!==undefined){S.colour=+d.colour;return update("colour")}
  if(d.filter){S.filter=d.filter;return panel()}
  if(d.wheel!==undefined){const first=!S.wheel;S.wheel=d.wheel||null;if(!S.wheel)S.zoom="full";return update(S.wheel?"wheel":"colour")}
  if(d.zoom){S.zoom=d.zoom;head();return fit()}
  if(d.step){const i=WHEELS.findIndex(w=>w.id===S.wheel);S.wheel=WHEELS[(i+ +d.step+WHEELS.length)%WHEELS.length].id;update("wheel");const el=document.querySelector(`[data-wheel="${S.wheel}"]`);if(el)el.scrollIntoView({block:"nearest",behavior:"smooth"});return}
});
addEventListener("resize",fit);
preload();update();
paint(layers[0],{...S}).then(()=>layers[0].classList.add("on"));
WHEELS.forEach(w=>img(w.face).catch(()=>{}));
</script>
